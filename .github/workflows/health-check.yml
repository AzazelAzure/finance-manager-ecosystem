name: Health Check

# External uptime monitor. Runs on GitHub-hosted runners so it is independent
# of the VPS. On failure the run exits non-zero and GitHub emails the repo owner.
#
# Origin :8443 is loopback-only (cloudflared → 127.0.0.1:8443). Public uptime is
# the Cloudflare edge on 443. Probe production hostnames over the public CA
# chain (no --resolve, no -k). A 403 still means the edge blocked the runner
# (WAF / bot reputation), not that the VPS is down.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:           # manual trigger for verification

env:
  WEB_URL: https://thehivemanager.com/
  API_HEALTH_URL: https://api.thehivemanager.com/api/health/

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check web app (Cloudflare edge)
        run: |
          code=""
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
              -A "Mozilla/5.0 (compatible; HFM-HealthCheck/1.0; +https://github.com/AzazelAzure/finance-manager-ecosystem)" \
              "$WEB_URL") || code="000"
            echo "Attempt ${attempt}: web edge response ${code}"
            case "$code" in
              200|301|302) break ;;
            esac
            [ "$attempt" -lt 3 ] && sleep 10
          done
          case "$code" in
            200|301|302) echo "OK: web edge reachable ($code)" ;;
            *) echo "FAIL: web edge returned $code"; exit 1 ;;
          esac

      - name: Check API health endpoint (Cloudflare edge)
        run: |
          code=""
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
              -A "Mozilla/5.0 (compatible; HFM-HealthCheck/1.0; +https://github.com/AzazelAzure/finance-manager-ecosystem)" \
              "$API_HEALTH_URL") || code="000"
            echo "Attempt ${attempt}: api health response ${code}"
            [ "$code" = "200" ] && break
            [ "$attempt" -lt 3 ] && sleep 10
          done
          if [ "$code" = "200" ]; then
            echo "OK: API health reachable (200)"
          else
            echo "FAIL: API health returned $code"
            exit 1
          fi
