# Ecosystem hostnames — additive vhosts for Orchestrator, ops console, and external adapter stub.
# Mounted separately for future extraction to standalone edge-proxy. Does not modify HFM blue/green maps.

    upstream orch_api_upstream {
        server host.containers.internal:8000;
    }

    upstream orch_console_upstream {
        server host.containers.internal:8081;
    }

    upstream external_adapter_upstream {
        server host.containers.internal:3000;
    }

    server {
        listen 443 ssl;
        server_name api.thedirectorate.dev;

        ssl_certificate     /etc/nginx/certs/thedirectorate.dev.pem;
        ssl_certificate_key /etc/nginx/certs/thedirectorate.dev-key.pem;

        location / {
            proxy_pass http://orch_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    server {
        listen 443 ssl;
        server_name www.thedirectorate.dev;

        ssl_certificate     /etc/nginx/certs/thedirectorate.dev.pem;
        ssl_certificate_key /etc/nginx/certs/thedirectorate.dev-key.pem;

        location / {
            proxy_pass http://orch_console_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    server {
        listen 443 ssl;
        server_name www.pproctor.com;

        ssl_certificate     /etc/nginx/certs/pproctor.com.pem;
        ssl_certificate_key /etc/nginx/certs/pproctor.com-key.pem;

        location / {
            proxy_pass http://external_adapter_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    server {
        listen 80;
        server_name api.thedirectorate.dev www.thedirectorate.dev www.pproctor.com;
        return 301 https://$host$request_uri;
    }
